name: Repoint protected v0.1.3 tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repoint:
    name: Repoint dart-v0.1.3 to corrected workflow
    runs-on: ubuntu-latest
    environment:
      name: release-automation
    steps:
      - name: Create repository-scoped release App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Repoint the protected tag
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TAG_NAME: dart-v0.1.3
          TARGET_COMMIT: a55adf90302048b89fd82fbd38b805a6aef07de5
        run: |
          set -euo pipefail
          tag_json=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG_NAME" \
            -f message="$TAG_NAME" \
            -f object="$TARGET_COMMIT" \
            -f type=commit)
          tag_sha=$(jq -er '.sha' <<<"$tag_json")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG_NAME" \
            -f sha="$tag_sha" \
            -F force=true
