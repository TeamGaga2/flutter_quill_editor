name: Flutter client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - clients/flutter_quill_editor/**
      - .github/workflows/flutter-client.yml
  push:
    branches:
      - dev
      - main
    paths:
      - clients/flutter_quill_editor/**
      - .github/workflows/flutter-client.yml
    tags:
      - "dart-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: flutter-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter_quill_editor
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: clients/flutter_quill_editor/.fvmrc
          cache: true
      - run: flutter pub get
      - name: Verify locked runtime
        run: dart run tool/richtext_runtime_prepare.dart --verify
      - run: flutter analyze
      - run: flutter test
      - name: Verify example resolves
        run: |
          cd example
          flutter pub get
          flutter build web
      - run: flutter pub publish --dry-run

  publish:
    name: Publish to pub.dev
    if: startsWith(github.ref, 'refs/tags/dart-v')
    needs: analyze-and-test
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/flutter_quill_editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
      - uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f
        with:
          channel: stable
      - name: Install dependencies without publish credentials
        env:
          PUB_TOKEN: ""
        run: dart pub get
      - name: Publish dry run without publish credentials
        env:
          PUB_TOKEN: ""
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish -f
