name: Flutter client

on:
  workflow_dispatch:
    inputs:
      package_tag:
        description: "Existing dart-vX.Y.Z tag to validate and publish"
        required: true
        type: string
  pull_request:
    paths:
      - clients/flutter_quill_editor/**
      - .github/workflows/flutter-client.yml
  push:
    branches:
      - dev
      - main
    paths:
      - clients/flutter_quill_editor/**
      - .github/workflows/flutter-client.yml
    tags:
      - "dart-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: flutter-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter_quill_editor
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.package_tag || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: clients/flutter_quill_editor/.fvmrc
          cache: true
      - run: flutter pub get
      - name: Verify locked runtime
        run: dart run tool/richtext_runtime_prepare.dart --verify
      - run: flutter analyze
      - run: flutter test
      - name: Verify example resolves
        run: |
          cd example
          flutter pub get
          flutter build web
      - run: flutter pub publish --dry-run

  publish:
    name: Publish to pub.dev
    if: >-
      startsWith(github.ref, 'refs/tags/dart-v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.package_tag, 'dart-v'))
    needs: analyze-and-test
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/flutter_quill_editor
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.package_tag || github.ref }}
      - uses: dart-lang/setup-dart@v1
      - uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable
      - name: Remove publish credentials for public dependency resolution
        run: dart pub token remove https://pub.dev
      - name: Install dependencies without publish credentials
        run: dart pub get
      - name: Publish dry run without publish credentials
        run: dart pub publish --dry-run
      - name: Restore OIDC publish credentials
        run: dart pub token add https://pub.dev --env-var PUB_TOKEN
      - name: Publish to pub.dev
        run: dart pub publish -f --skip-validation
